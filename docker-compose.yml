services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4210:4210"
    volumes:
      - ./frontend:/app/
      - /app/node_modules/
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8010:8010"
    volumes:
      - ./backend/app:/app/app
    environment:
      - DB_DRIVER=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kensei
      - DB_USER=postgres
      - DB_PASS=postgres
      # Optional: comma-separated exact origins, or "*"; unset = localhost/LAN regex.
      - XWA_CORS_ORIGINS=${XWA_CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kensei
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kensei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
